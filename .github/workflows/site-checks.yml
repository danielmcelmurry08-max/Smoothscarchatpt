name: SmoothScar site checks
on:
  push:
    branches: [main, fix-site-bugs-20261111]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Confirm build assets
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          grep -q 'rel="icon"' dist/index.html
