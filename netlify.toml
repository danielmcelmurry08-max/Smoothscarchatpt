[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # The script hash must match the inline <script> in site/index.html (verified by npm test).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-5Z412XAlbKU2GLkmV8L7vIM9aGqVZIgCIbr8pyGTCG0='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.wixstatic.com; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
