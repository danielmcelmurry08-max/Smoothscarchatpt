[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # The script hash must match the inline <script> in site/index.html (verified by npm test).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-XzmiT2A5dLhYO7eu/SbT7y9A5uoALfo/gGOk3ww+RaI=' 'sha256-L50N0tFp7g3AdHCADhyXrypEQGl5oULj5cRkkTqnoRA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.wixstatic.com; connect-src 'self'; frame-src https://calendly.com; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"

[[redirects]]
  from = "/providers/*"
  to = "/provider/:splat"
  status = 301
  force = true

# Legacy campaign URL; preserve inbound links and search referrals.
[[redirects]]
  from = "/evidence"
  to = "/scar-care-science/"
  status = 301
  force = true

[[redirects]]
  from = "/evidence/"
  to = "/scar-care-science/"
  status = 301
  force = true

# Browser legacy icon route: one canonical, branded SVG favicon.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301
  force = true
